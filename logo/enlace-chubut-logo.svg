<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Enlace Chubut · Portal de noticias</title>
  <desc id="desc">Logo tridimensional con eslabones entrelazados y un símbolo de reproducción.</desc>
  <defs>
    <linearGradient id="linkBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ed8f2"/><stop offset=".48" stop-color="#138cc5"/><stop offset="1" stop-color="#075082"/>
    </linearGradient>
    <linearGradient id="linkCyan" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#b7f7ff"/><stop offset=".42" stop-color="#36d2d8"/><stop offset="1" stop-color="#11929e"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd36c"/><stop offset="1" stop-color="#f28b32"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183b5b"/><stop offset="1" stop-color="#09263e"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset dy="18" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.02 0 0 0 0 0.15 0 0 0 0 0.24 0 0 0 .26 0" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sombra y eslabones en relieve: conexión + señal multimedia -->
  <g filter="url(#shadow)" transform="translate(54 16)">
    <g transform="rotate(-38 270 300)">
      <rect x="154" y="190" width="232" height="188" rx="88" fill="#073c64" opacity=".42" transform="translate(0 16)"/>
      <rect x="154" y="190" width="232" height="188" rx="88" fill="none" stroke="url(#linkBlue)" stroke-width="48"/>
      <path d="M194 216c16-15 35-22 57-22h61" fill="none" stroke="#a7f4ff" stroke-width="10" stroke-linecap="round" opacity=".74"/>
    </g>
    <g transform="rotate(38 270 300)">
      <rect x="154" y="222" width="232" height="188" rx="88" fill="#05616a" opacity=".38" transform="translate(0 16)"/>
      <rect x="154" y="222" width="232" height="188" rx="88" fill="none" stroke="url(#linkCyan)" stroke-width="48"/>
      <path d="M194 249c16-15 35-22 57-22h61" fill="none" stroke="#efffff" stroke-width="9" stroke-linecap="round" opacity=".8"/>
    </g>
    <path d="M254 252 350 300 254 348Z" fill="#a95220" opacity=".48" transform="translate(5 11)"/>
    <path d="M254 252 350 300 254 348Z" fill="url(#play)" stroke="#fff4d5" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <g font-family="Montserrat, Arial, sans-serif">
    <text x="880" y="296" text-anchor="middle" font-size="128" font-weight="800" letter-spacing="5" fill="url(#play)">ENLACE</text>
    <path d="M558 333h660" stroke="#edf5f8" stroke-width="4"/>
    <text x="880" y="414" text-anchor="middle" font-size="70" font-weight="700" letter-spacing="15" fill="#1399aa">CHUBUT</text>
    <text x="880" y="468" text-anchor="middle" font-size="25" font-weight="600" letter-spacing="6" fill="#dce8ed">PORTAL DE NOTICIAS</text>
  </g>
</svg>
